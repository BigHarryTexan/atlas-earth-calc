<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas Earth Earnings</title>

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    background: #f2f2f7;
    margin: 0;
    padding: 20px;
  }
  h1 { text-align: center; }
  .card {
    background: white;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 16px;
  }
  label {
    font-weight: 600;
    display: block;
    margin-top: 10px;
  }
  input {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    margin-top: 4px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }
  .result {
    font-size: 17px;
    margin: 6px 0;
  }
  .section-title {
    font-weight: 700;
    margin-top: 12px;
  }
</style>
</head>

<body>

<h1>Atlas Earth Earnings</h1>

<div class="card">
  <label>Common Parcels</label>
  <input type="number" id="common" inputmode="numeric" pattern="[0-9]*">

  <label>Rare Parcels</label>
  <input type="number" id="rare" inputmode="numeric" pattern="[0-9]*">

  <label>Epic Parcels</label>
  <input type="number" id="epic" inputmode="numeric" pattern="[0-9]*">

  <label>Legendary Parcels</label>
  <input type="number" id="legendary" inputmode="numeric" pattern="[0-9]*">

  <label>Passport Badges</label>
  <input type="number" id="badges" inputmode="numeric" pattern="[0-9]*">
</div>

<div class="card">
  <div class="section-title">Multipliers</div>
  <div class="result" id="propertyMult"></div>
  <div class="result" id="badgeBoost"></div>
  <div class="result" id="effectiveMult"></div>

  <div class="section-title">Daily Earnings</div>
  <div class="result" id="daily"></div>

  <div class="section-title">Time to $1</div>
  <div class="result" id="timeToDollar"></div>
</div>

<script>
const rates = {
  common: 0.0000000011,
  rare: 0.0000000016,
  epic: 0.0000000022,
  legendary: 0.0000000044
};

const secondsPerDay = 86400;

function getPropertyMultiplier(total) {
  if (total <= 150) return 30;
  if (total <= 220) return 20;
  if (total <= 300) return 15;
  if (total <= 400) return 10;
  if (total <= 500) return 5;
  return 1;
}

function getBadgeBoost(badges) {
  if (badges >= 101) return 0.25;
  if (badges >= 61) return 0.20;
  if (badges >= 31) return 0.15;
  if (badges >= 11) return 0.10;
  if (badges >= 1) return 0.05;
  return 0;
}

function formatTime(days) {
  if (!isFinite(days) || days <= 0) return "—";
  if (days >= 1) return `${days.toFixed(2)} days`;
  return `${(days * 24).toFixed(2)} hours`;
}

function calculate() {
  const common = Number(document.getElementById("common").value) || 0;
  const rare = Number(document.getElementById("rare").value) || 0;
  const epic = Number(document.getElementById("epic").value) || 0;
  const legendary = Number(document.getElementById("legendary").value) || 0;
  const badges = Number(document.getElementById("badges").value) || 0;

  const totalParcels = common + rare + epic + legendary;

  const baseMult = getPropertyMultiplier(totalParcels);
  const boost = getBadgeBoost(badges);
  const effectiveMult = baseMult * (1 + boost);

  const ratePerSecond =
    common * rates.common +
    rare * rates.rare +
    epic * rates.epic +
    legendary * rates.legendary;

  const daily = ratePerSecond * secondsPerDay * effectiveMult;

  document.getElementById("propertyMult").textContent =
    `Property Multiplier: ${baseMult}×`;

  document.getElementById("badgeBoost").textContent =
    `Passport Boost: ${(boost * 100).toFixed(0)}%`;

  document.getElementById("effectiveMult").textContent =
    `Effective Multiplier: ${effectiveMult.toFixed(2)}×`;

  document.getElementById("daily").textContent =
    `Daily Earnings: $${daily.toFixed(6)}`;

  document.getElementById("timeToDollar").textContent =
    `Time to $1: ${formatTime(1 / daily)}`;
}

document.querySelectorAll("input").forEach(input =>
  input.addEventListener("input", calculate)
);

calculate();
</script>

</body>
</html>
